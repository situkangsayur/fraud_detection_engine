[project]
name = "fraud-simulator"
version = "0.1.0"
description = "Synthetic multi-typology fraud data generator that drives the fraud platform through its public gateway API"
license = "AGPL-3.0-only"
authors = [{ name = "Hendri Karisma", email = "situkangsayur@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.27"]

[project.scripts]
fraud-simulator = "simulator.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3", "respx>=0.21", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S311", "RUF001", "RUF002", "RUF003"]   # S311: non-crypto RNG is intended (deterministic synthetic data)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests/"]
