[project]
name = "llm-service"
version = "0.1.0"
description = "LLM assistant service: regulation/policy RAG, chat with tools, rule analyses and rule proposals"
license = "AGPL-3.0-only"
authors = [{ name = "Hendri Karisma", email = "situkangsayur@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "opensearch-py>=2.6",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "pyjwt>=2.9",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: needs docker (real Postgres with migrations + OpenSearch)"]
addopts = "-m 'not integration'"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/llm_service/repository.py" = ["S608"]
"tests/**" = ["S105", "S106", "S108", "S603", "S607"]  # tests shell out to docker with constant args

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["llm_service"]
ignore_missing_imports = true
disallow_untyped_decorators = false
