[project]
name = "ml-service"
version = "0.1.0"
description = "Fraud platform ML service: algorithm plugins, training, serving, clustering, graph communities"
license = "AGPL-3.0-only"
authors = [{ name = "Hendri Karisma", email = "situkangsayur@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "networkx>=3.3",
    "joblib>=1.4",
    "jsonschema>=4.23",
    "torch>=2.4",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-jsonschema",
    "pandas-stubs",
]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_service"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF"]
# E501: `ruff format` owns line length (long SQL/docstrings are intentional); RUF001-3: typographic –, ×, σ
ignore = ["S101", "S608", "B008", "RUF012", "N803", "N806", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_calls = false
warn_return_any = false
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
