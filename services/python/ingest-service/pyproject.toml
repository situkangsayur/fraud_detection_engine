[project]
name = "ingest-service"
version = "0.1.0"
description = "Fraud platform ingest-service: schema inference, mapping suggestion, file/SQL import jobs, pull connectors"
license = "AGPL-3.0-only"
authors = [{ name = "Hendri Karisma", email = "situkangsayur@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "pymysql>=1.1",
  "pandas>=2.2",
  "pyarrow>=17",
  "openpyxl>=3.1",
  "charset-normalizer>=3.3",
  "httpx>=0.27",
  "structlog>=24.4",
  "prometheus-client>=0.20",
  "pyjwt>=2.9",
  "python-multipart>=0.0.9",
  "rapidfuzz>=3.9",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs>=2.2",
  "types-pymysql",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S608", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E501"]
"app/repo.py" = ["E501"]  # SQL literals read better unwrapped

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]
