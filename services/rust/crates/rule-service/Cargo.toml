[package]
name = "rule-service"
description = "Rule service: rules, versions, rulesets, reference lists, validation, evaluation, backtests, proposals."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rule-service"
path = "src/main.rs"

[lib]
name = "rule_service"
path = "src/lib.rs"

[dependencies]
platform = { workspace = true }
contracts = { workspace = true }
rule-engine = { workspace = true }

tokio = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
sqlx = { workspace = true, features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
moka = { workspace = true }
utoipa = { workspace = true }
utoipa-scalar = { workspace = true }
# CSV import of reference-list entries (streaming, RFC 4180 quoting).
csv = "1"

[dev-dependencies]
pretty_assertions = { workspace = true }
tower = { workspace = true }
http-body-util = "0.1"

[lints]
workspace = true
