name: CI

on:
  push:
    branches: ["master", "revamp/**"]
  pull_request:
    branches: ["master"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ database schema + RLS
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations to Postgres 16 and run RLS smoke tests
        run: |
          out=$(bash db/tests/test_migrations.sh 2>&1); echo "$out"
          echo "$out" | grep -q "no tenant set -> projects visible: 0"
          echo "$out" | grep -q "tenant1 -> projects visible: 1"
          echo "$out" | grep -q 'violates row-level security policy for table "customers"'
          echo "$out" | grep -q "permission denied for table events"
          docker rm -f fraud-mig-test

  # ------------------------------------------------------------------ Rust workspace
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Integration tests (real Postgres via Docker)
        run: |
          crates/rule-service/tests/run-integration.sh
          crates/core-api/tests/run-integration.sh

  # ------------------------------------------------------------------ Python services
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: services/python/ml-service,     src: src }
          - { dir: services/python/llm-service,    src: src }
          - { dir: services/python/ingest-service, src: app }
          - { dir: tools/simulator,                src: simulator }
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy ${{ matrix.src }}
      - run: uv run pytest -q

  # ------------------------------------------------------------------ Web (Nuxt)
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # ------------------------------------------------------------------ Container images
  images:
    runs-on: ubuntu-latest
    needs: [migrations, rust, python, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: |
          cp .env.example .env
          docker compose build
